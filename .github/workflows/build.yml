name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Generate Android wrapper
        run: flutter create --platforms=android --project-name football_manager --org com.example .
      - name: Align Gradle wrapper with Android Gradle Plugin
        run: sed -i 's/gradle-7\.6\.3-all\.zip/gradle-8.4-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: football-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
