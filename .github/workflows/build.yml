name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify source revision
        run: echo "Building the current main revision"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name appmaker .
      - run: flutter pub get
      - name: Convert club crests to PNG for reliable Android rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets/logos_png
          for file in assets/logos/*.svg; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .svg)
            rsvg-convert --width 512 --height 512 "$file" --output "assets/logos_png/$name.png"
          done
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          curl -fsSL https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf -o assets/fonts/Vazirmatn-Regular.ttf
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: appmaker-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
