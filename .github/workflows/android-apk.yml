name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/football-manager-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-manager-debug-apk
          path: build/football-manager-debug.apk
          if-no-files-found: error
          retention-days: 14
