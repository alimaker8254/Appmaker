name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "football-manager/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java and Android export prerequisites
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip curl
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          java -version
          test -d "$ANDROID_HOME"

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"             -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v             -keystore /tmp/football-manager-debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF
          echo "Android SDK contents:"
          ls -la "$ANDROID_HOME"
          echo "SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "SDK build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Validate project
        run: godot --headless --path football-manager --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p football-manager/build
          echo "Installed Android NDK:"
          ls -la "$ANDROID_HOME/ndk"
          echo "Installed CMake:"
          ls -la "$ANDROID_HOME/cmake"
          echo "Android tools:"
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/ndk/23.2.8568313/ndk-build" --version
          godot --verbose --headless --path football-manager --export-debug "Android" football-manager/build/FootballClubManager.apk
          test -s football-manager/build/FootballClubManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballClubManager-APK
          path: football-manager/build/FootballClubManager.apk
          if-no-files-found: error
          retention-days: 14
