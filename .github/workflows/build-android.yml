name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "football-manager/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build folder
        run: mkdir -p football-manager/build

      - name: Validate project
        run: godot --headless --path football-manager --editor --quit

      - name: Export Android APK
        run: godot --headless --path football-manager --export-debug "Android" football-manager/build/FootballClubManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballClubManager-APK
          path: football-manager/build/FootballClubManager.apk
          if-no-files-found: error
          retention-days: 14
