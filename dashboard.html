<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>باشگاه من | فوتبال</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <div class="bg-lines-green"></div>

    <!-- نوار بالا -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="club-info-box">
                <div class="club-logo-mini" id="dashClubLogo"></div>
                <div class="club-text">
                    <span class="club-title">باشگاه من</span>
                    <span class="club-sub">My Club</span>
                </div>
            </div>
        </div>
        
        <div class="top-bar-center">
            <div class="level-box">
                <span class="level-text" id="dashLevel">Lv. 1</span>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="top-bar-right">
            <div class="currency-box">
                <span class="coin-icon">💰</span>
                <span>250,000</span>
            </div>
            <div class="currency-box">
                <span class="gem-icon">💎</span>
                <span>3 LP</span>
            </div>
            <button class="settings-btn">⚙️</button>
        </div>
    </div>

    <!-- کارت‌های اصلی -->
    <div class="dashboard-grid">
        <!-- مسابقات -->
        <div class="dash-card card-green">
            <div class="card-icon pitch-icon">
                <svg viewBox="0 0 100 100"><rect x="10" y="20" width="80" height="60" fill="none" stroke="white" stroke-width="4"/><circle cx="50" cy="50" r="10" fill="none" stroke="white" stroke-width="4"/><line x1="50" y1="20" x2="50" y2="80" stroke="white" stroke-width="4"/></svg>
            </div>
            <div class="card-text">
                <h2>مسابقات</h2>
                <span>Matches</span>
            </div>
            <div class="card-arrow">➤</div>
        </div>

        <!-- جدول لیگ -->
        <div class="dash-card card-blue league-table-card">
            <div class="league-header">
                <span class="trophy-icon">🏆</span>
                <h2>جدول لیگ</h2>
            </div>
            <div class="league-list" id="leagueList">
                <!-- لیست توسط JS ساخته می‌شود -->
            </div>
        </div>

        <!-- ارتقا بازیکنان -->
        <div class="dash-card card-gold">
            <div class="card-icon player-upgrade-icon">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="15" fill="white"/><path d="M25 80 Q50 40 75 80" fill="white"/></svg>
            </div>
            <div class="card-text">
                <h2>ارتقا بازیکنان</h2>
                <span>Player Upgrade</span>
            </div>
            <div class="card-arrow">➤</div>
        </div>

        <!-- خرید بازیکن -->
        <div class="dash-card card-green">
            <div class="card-icon search-icon">
                <svg viewBox="0 0 100 100"><circle cx="40" cy="40" r="20" fill="none" stroke="white" stroke-width="6"/><line x1="55" y1="55" x2="80" y2="80" stroke="white" stroke-width="8"/><circle cx="40" cy="40" r="10" fill="white"/></svg>
            </div>
            <div class="card-text">
                <h2>خرید بازیکن</h2>
                <span>Buy Player</span>
            </div>
            <div class="card-arrow">➤</div>
        </div>

        <!-- تاکتیک‌ها -->
        <div class="dash-card card-purple">
            <div class="card-icon tactic-icon">
                <svg viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="none" stroke="white" stroke-width="4"/><circle cx="30" cy="30" r="5" fill="white"/><circle cx="70" cy="30" r="5" fill="white"/><circle cx="50" cy="50" r="5" fill="white"/></svg>
            </div>
            <div class="card-text">
                <h2>تاکتیک‌ها</h2>
                <span>Tactics</span>
            </div>
            <div class="card-arrow">➤</div>
        </div>

        <!-- خرید مربی -->
        <div class="dash-card card-orange">
            <div class="card-icon coach-icon">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="15" fill="white"/><path d="M20 80 Q50 50 80 80" fill="white"/></svg>
            </div>
            <div class="card-text">
                <h2>خرید مربی</h2>
                <span>Hire Coach</span>
            </div>
            <div class="card-arrow">➤</div>
        </div>
    </div>

    <script src="teams.js"></script>
    <script src="app.js"></script>
</body>
</html>
